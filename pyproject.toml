[project]
name = "jackrabbit"
version = "0.1.0"
description = "Ticket tracking and sprint management system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlmodel>=0.0.21",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "pydantic-settings>=2.3.0",
    "pre-commit>=4.6.2",
    "python-multipart>=0.0.32",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# Development tooling lives in a dependency group, not in
# [project.optional-dependencies]: `uv sync` installs it by default, extras are
# for optional *runtime* features, and [tool.uv] dev-dependencies is deprecated.
[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "playwright>=1.44.0",
    "beautifulsoup4>=4.15.0",
    "ruff==0.16.10",
    "mypy>=1.10.0",
    "httpx2>=2.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["jackrabbit"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # print statements
]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
strict_equality = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
# `tests/e2e/conftest.py` applies the e2e marker to every test in that
# directory, so `pytest -m "not e2e"` skips the browser suite from any rootdir.
# The cdx/lighthouse/performance/slow markers were registered but used by no
# test (and the tools they named were not installed), so they are gone; re-add
# a marker together with the test that uses it.
markers = [
    "e2e: end-to-end browser tests (Playwright)",
]

[tool.coverage.run]
source = ["jackrabbit"]
branch = true
omit = ["jackrabbit/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Spec target: >90% of business logic in services (tracked via make test-cov)
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jackrabbit*"]
