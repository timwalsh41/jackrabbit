name: CI
on: [push, pull_request]

env:
  PYTHON_VERSION: '3.12'
  UV_VERSION: 'latest'

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      # Frontend assets are local-only: the purged stylesheet is a committed
      # build artifact, so a template change without a rebuild must fail CI.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify committed stylesheet is current
        run: |
          npm --prefix frontend install --no-audit --no-fund
          npm --prefix frontend run build
          git diff --quiet -- jackrabbit/static/css/tailwind.css || { echo "::error::jackrabbit/static/css/tailwind.css is stale - run 'make build-css' and commit the result"; exit 1; }

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Run mypy
        run: uv run mypy

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest tests/unit -v --tb=short -x

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: .coverage
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Run integration tests
        run: uv run pytest tests/integration -v --tb=short -x

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage
          path: .coverage
          retention-days: 7

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      # Headed Chrome needs a display server in CI
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # The e2e suite starts its own server: ephemeral port + throwaway
      # DATA_DIR per ADR-0020, so no manual server/port coordination here.
      # Headed Chrome (per spec: "headed Chrome in CI"), driven under Xvfb
      - name: Run E2E tests
        run: xvfb-run --auto-servernum uv run pytest tests/e2e -v --tb=short -x
        env:
          CHROME_DEVTOOLS_AXI_HEADED: '1'

      # Second consecutive run: proves the suite leaves no database state that
      # the next run's numbering/date assertions would depend on
      - name: Run E2E tests again (hermetic guard)
        run: xvfb-run --auto-servernum uv run pytest tests/e2e -q -x
        env:
          CHROME_DEVTOOLS_AXI_HEADED: '1'

      - name: Upload E2E artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Combined check job for quick feedback on PRs
  check:
    name: Quick Check
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: github.event_name == 'pull_request'
    steps:
      - name: All checks passed
        run: echo "Lint and typecheck passed"

  # Full test suite
  test-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - name: All tests passed
        run: echo "All test suites passed"