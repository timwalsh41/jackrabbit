[mypy]
python_version = 3.12
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
strict_equality = true

# Check the source trees when invoked bare (`mypy`), which is what the
# `typecheck` target and CI do. An `exclude` regex was tried first and is easy
# to get wrong: mypy matches it against absolute paths, so `exclude = tests`
# silently excluded nothing and `mypy .` reported 658 errors in test files.
files = jackrabbit, alembic, server.py

# Per-module options
[mypy-pydantic.*]
ignore_missing_imports = true

[mypy-sqlalchemy.*]
ignore_missing_imports = true

[mypy-pydantic_settings.*]
ignore_missing_imports = true
