{% extends "base.html" %}

{% block title %}Jackrabbit - Backlog{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-900">Backlog</h1>
        <button class="btn btn-primary" hx-get="/tickets/new" hx-target="#ticket-modal" hx-swap="innerHTML">
            New Ticket
        </button>
    </div>

    <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Priority</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Project</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Sprint</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200" id="tickets-table-body">
                <tr>
                    <td colspan="8" class="px-4 py-8 text-center text-gray-500">
                        Loading tickets...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div id="ticket-modal"></div>

<script>
    // Load tickets on page load
    document.body.addEventListener('htmx:load', function() {
        htmx.ajax('GET', '/api/v1/tickets', {target: '#tickets-table-body', swap: 'innerHTML'});
    });
</script>
{% endblock %}
