<tr id="project-row-{{ project.id }}">
    <td class="px-6 py-4 whitespace-nowrap">
        <span class="font-mono text-sm font-medium text-gray-900">{{ project.prefix }}</span>
        {% if project.is_system %}
        <span class="ml-2 inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800">system</span>
        {% endif %}
    </td>
    <td class="px-6 py-4 whitespace-nowrap">
        <span class="text-sm text-gray-900">{{ project.name }}</span>
        {% if project.description %}
        <p class="text-xs text-gray-500 truncate max-w-xs">{{ project.description }}</p>
        {% endif %}
    </td>
    <td class="px-6 py-4 whitespace-nowrap">
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
              style="background-color: {{ project.color }}20; color: {{ project.color }};">
            {{ project.color }}
        </span>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
        {{ ticket_count }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-3">
        <a href="/backlog?project_id={{ project.id }}"
           class="text-indigo-600 hover:text-indigo-900">
            Tickets
        </a>
        <a href="/projects/{{ project.id }}/edit"
           hx-get="/projects/{{ project.id }}/edit"
           hx-target="#project-row-{{ project.id }}"
           hx-swap="outerHTML"
           class="text-indigo-600 hover:text-indigo-900">
            Edit
        </a>
        {% if not project.is_system %}
        <button hx-delete="/api/v1/projects/{{ project.id }}"
                hx-target="#project-row-{{ project.id }}"
                hx-swap="outerHTML swap:1s"
                hx-confirm="Are you sure you want to delete this Project? This action cannot be undone."
                class="text-red-600 hover:text-red-900">
            Delete
        </button>
        {% else %}
        <span class="text-gray-400 cursor-not-allowed" title="System Projects cannot be deleted">Delete</span>
        {% endif %}
    </td>
</tr>
