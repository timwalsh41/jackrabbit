{% for item in sprints %}
    {% set sprint = item.sprint %}
    {% set tickets = item.tickets %}
    {% set status = item.status %}
    {% include "sprint_row.html" %}
{% endfor %}
{% if not sprints %}
    <tr>
        <td colspan="6" class="px-6 py-8 text-center text-gray-500">
            No sprints yet. <button class="text-indigo-600 hover:text-indigo-900"
                    hx-get="/sprints/new"
                    hx-target="#sprint-modal"
                    hx-swap="innerHTML">Create one</button>
        </td>
    </tr>
{% endif %}
