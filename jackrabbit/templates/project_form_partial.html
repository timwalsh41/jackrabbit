<form id="project-form"
      {% if project %}hx-patch{% else %}hx-post{% endif %}="{{ action }}"
      hx-target="#project-form"
      hx-swap="outerHTML"
      class="space-y-6">
    {% if error %}
    <div class="rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
        {{ error }}
    </div>
    {% endif %}
    <div>
        <label for="prefix" class="block text-sm font-medium text-gray-700 mb-1">Prefix <span class="text-red-500">*</span></label>
        <input type="text"
               id="prefix"
               name="prefix"
               maxlength="10"
               pattern="[A-Za-z]{2,10}"
               value="{{ form_prefix if form_prefix is defined and form_prefix else (project.prefix if project else '') }}"
               {% if project %}readonly{% endif %}
               required
               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 {% if project %}bg-gray-50{% endif %}"
               placeholder="e.g., WEB">
        <p class="mt-1 text-sm text-gray-500">2-10 uppercase letters. Cannot be changed after creation.</p>
    </div>

    <div>
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name <span class="text-red-500">*</span></label>
        <input type="text"
               id="name"
               name="name"
               value="{{ form_name if form_name is defined and form_name else (project.name if project else '') }}"
               required
               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
               placeholder="e.g., Web Application">
    </div>

    <div>
        <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea id="description"
                  name="description"
                  rows="3"
                  class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                  placeholder="Optional description...">{{ form_description if form_description is defined and form_description else (project.description if project else '') }}</textarea>
    </div>

    <div>
        <label for="color" class="block text-sm font-medium text-gray-700 mb-1">Color</label>
        <input type="text"
               id="color"
               name="color"
               value="{{ form_color if form_color is defined and form_color else (project.color if project else '#6366f1') }}"
               pattern="#[0-9a-fA-F]{6}"
               class="w-full max-w-xs px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 font-mono"
               placeholder="#6366f1">
        <p class="mt-1 text-sm text-gray-500">Hex color code (e.g., #6366f1)</p>
    </div>

    <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
        <a href="/projects"
           class="px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 transition-colors">
            Cancel
        </a>
        <button type="submit"
                class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition-colors">
            {% if project %}Save Changes{% else %}Create Project{% endif %}
        </button>
    </div>
</form>
