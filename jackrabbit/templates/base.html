<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Jackrabbit{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/json-enc.js"></script>
    <script src="https://unpkg.com/hyperscript.org@0.9.12"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
        .htmx-request .htmx-indicator { opacity: 1; }
        .htmx-request.htmx-indicator { opacity: 1; }
    </style>
    <script>
        // Dropdown handling for Move to Sprint
        document.addEventListener('click', function(event) {
            // Close dropdowns when clicking outside
            if (!event.target.closest('[id^="move-to-sprint-"]')) {
                document.querySelectorAll('[id^="move-to-sprint-dropdown-"]').forEach(function(dropdown) {
                    dropdown.classList.add('hidden');
                });
                document.querySelectorAll('[id^="move-to-sprint-"]').forEach(function(btn) {
                    btn.setAttribute('aria-expanded', 'false');
                });
            }
        });
        
        // Toggle dropdown
        document.addEventListener('click', function(event) {
            const btn = event.target.closest('[id^="move-to-sprint-"]:not([id^="move-to-sprint-dropdown-"])');
            if (btn) {
                const ticketId = btn.id.replace('move-to-sprint-', '');
                const dropdown = document.getElementById('move-to-sprint-dropdown-' + ticketId);
                if (dropdown) {
                    const isHidden = dropdown.classList.contains('hidden');
                    // Close all other dropdowns first
                    document.querySelectorAll('[id^="move-to-sprint-dropdown-"]').forEach(function(d) {
                        d.classList.add('hidden');
                    });
                    document.querySelectorAll('[id^="move-to-sprint-"]').forEach(function(b) {
                        b.setAttribute('aria-expanded', 'false');
                    });
                    // Toggle this one
                    if (isHidden) {
                        dropdown.classList.remove('hidden');
                        btn.setAttribute('aria-expanded', 'true');
                    } else {
                        dropdown.classList.add('hidden');
                        btn.setAttribute('aria-expanded', 'false');
                    }
                }
            }
        });
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold text-indigo-600">Jackrabbit</a>
                    <div class="ml-8 flex space-x-4">
                        <a href="/backlog" class="text-gray-700 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium">Backlog</a>
                        <a href="/sprints" class="text-gray-700 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium">Sprints</a>
                        <a href="/plan" class="text-gray-700 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium">Plan</a>
                        <a href="/projects" class="text-gray-700 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium">Projects</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t border-gray-200 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <p class="text-center text-gray-500 text-sm">Jackrabbit - Ticket tracking & sprint management</p>
        </div>
    </footer>
</body>
</html>
