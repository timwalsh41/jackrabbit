<div class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="flex min-h-full items-center justify-center p-4 text-center">
        <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true"></div>
        <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
        <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-3xl sm:w-full">
            <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                <div class="sm:flex sm:items-start">
                    <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                        <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">
                            New Ticket
                        </h3>
                    </div>
                </div>
                
                <form hx-post="{{ action }}"
                      hx-swap="none"
                      id="ticket-form"
                      class="mt-4 space-y-4"
                      hx-headers='{"Content-Type": "application/json"}'
                      hx-ext="json-enc"
                      hx-on::after-request="console.log('ticket form after-request', event.detail.xhr.status, event.detail.successful); if(event.detail.xhr.status === 201 || event.detail.xhr.status === 200) { console.log('Closing modal and refreshing table'); closeModal(); htmx.ajax('GET', '/backlog', {target: '#tickets-table-body', swap: 'innerHTML', headers: {'HX-Request': 'true'}}); }"
                      hx-on::submit="console.log('Form submitting...');"
                      hx-on::after-settle="console.log('Form settled');">
                    <div>
                        <label for="project_id" class="block text-sm font-medium text-gray-700 mb-1">Project <span class="text-red-500">*</span></label>
                        <select name="project_id" id="project_id" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                            {% for project in projects %}
                            <option value="{{ project.id }}" {% if default_project_id == project.id %}selected{% endif %}>
                                {{ project.prefix }} - {{ project.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label for="type" class="block text-sm font-medium text-gray-700 mb-1">Type <span class="text-red-500">*</span></label>
                        <select name="type" id="type" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                            {% for t in TicketType %}
                            <option value="{{ t.value }}" {% if t == TicketType.STORY %}selected{% endif %}>
                                {{ t.value }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title <span class="text-red-500">*</span></label>
                        <input type="text"
                               id="title"
                               name="title"
                               value=""
                               required
                               maxlength="255"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                               placeholder="Brief ticket title...">
                    </div>

                    <div>
                        <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                        <textarea id="description"
                                  name="description"
                                  rows="4"
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                                  placeholder="Detailed description..."></textarea>
                    </div>

                    {% include "label_field.html" %}

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="priority" class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
                            <select name="priority" id="priority"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                                {% for p in Priority %}
                                <option value="{{ p.value }}" {% if p == Priority.MEDIUM %}selected{% endif %}>
                                    {{ p.value }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div>
                            <label for="story_points" class="block text-sm font-medium text-gray-700 mb-1">Story Points</label>
                            <input type="number"
                                   id="story_points"
                                   name="story_points"
                                   value=""
                                   min="0"
                                   max="100"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                                   placeholder="Optional (e.g., 5)">
                        </div>
                    </div>

                    <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
                        <button type="button" 
                                class="px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 transition-colors"
                                onclick="closeModal()">
                            Cancel
                        </button>
                        <button type="submit"
                                class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition-colors">
                            Create Ticket
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Ensure json-enc extension is registered
    (function() {
        if (typeof htmx !== 'undefined' && htmx.defineExtension && (!htmx.extensions || !htmx.extensions['json-enc'])) {
            console.log('Registering json-enc extension manually in ticket form');
            htmx.defineExtension('json-enc', {
                onEvent: function(name, evt) {
                    if (name === "htmx:configRequest") {
                        evt.detail.headers['Content-Type'] = "application/json";
                    }
                },
                encodeParameters: function(xhr, parameters, elt) {
                    xhr.overrideMimeType('text/json');
                    return JSON.stringify(parameters);
                }
            });
        }
    })();
    
    function closeModal() {
        const modal = document.getElementById('ticket-modal');
        if (modal) {
            modal.innerHTML = '';
        }
    }
    
    // Close on backdrop click
    document.addEventListener('click', function(e) {
        if (e.target.classList.contains('bg-gray-500')) {
            closeModal();
        }
    });
    
    // Close on Escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeModal();
        }
    });
    
    // Close modal on successful form submission
    document.body.addEventListener('htmx:afterRequest', function(evt) {
        console.log('htmx:afterRequest', evt.detail);
        if (evt.detail.successful && evt.detail.target && evt.detail.target.id === 'ticket-form') {
            // Close modal
            const modal = document.getElementById('ticket-modal');
            if (modal) {
                modal.innerHTML = '';
            }
            // Refresh the table with HX-Request header to get partial
            htmx.ajax('GET', '/backlog', {
                target: '#tickets-table-body', 
                swap: 'innerHTML',
                headers: {'HX-Request': 'true'}
            });
        }
    });
    
    // Also listen for htmx:afterSwap on the form target to handle redirect
    document.body.addEventListener('htmx:afterSwap', function(evt) {
        console.log('htmx:afterSwap', evt.detail);
        if (evt.detail.target && evt.detail.target.id === 'ticket-form') {
            // If we got a redirect response (table row), close modal and refresh
            if (evt.detail.xhr && evt.detail.xhr.responseText && evt.detail.xhr.responseText.includes('ticket-row-')) {
                const modal = document.getElementById('ticket-modal');
                if (modal) {
                    modal.innerHTML = '';
                }
                htmx.ajax('GET', '/backlog', {
                    target: '#tickets-table-body', 
                    swap: 'innerHTML',
                    headers: {'HX-Request': 'true'}
                });
            }
        }
    });
</script>
