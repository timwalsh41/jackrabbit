<tr id="project-row-{{ project.id }}">
    <td colspan="5" class="px-6 py-4 bg-indigo-50/50">
        <form hx-patch="/projects/{{ project.id }}"
              hx-target="#project-row-{{ project.id }}"
              hx-swap="outerHTML"
              class="space-y-4">
            {% if error %}
            <div class="rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
                {{ error }}
            </div>
            {% endif %}
            <div class="flex items-center gap-4">
                <span class="font-mono text-sm font-medium text-gray-900 bg-gray-100 px-2 py-1 rounded">{{ project.prefix }}</span>
                <input type="text"
                       name="name"
                       value="{{ form_name if form_name is defined and form_name else project.name }}"
                       required
                       class="flex-1 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                       placeholder="Project name">
                <input type="text"
                       name="color"
                       value="{{ form_color if form_color is defined and form_color else project.color }}"
                       pattern="#[0-9a-fA-F]{6}"
                       class="w-32 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 font-mono"
                       placeholder="#6366f1">
            </div>
            <textarea name="description"
                      rows="2"
                      class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                      placeholder="Optional description...">{{ form_description if form_description is defined and form_description else project.description }}</textarea>
            <div class="flex justify-end space-x-2">
                <button type="button"
                        hx-get="/projects/{{ project.id }}/row"
                        hx-target="#project-row-{{ project.id }}"
                        hx-swap="outerHTML"
                        class="px-3 py-1.5 text-sm text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">
                    Cancel
                </button>
                <button type="submit"
                        class="px-3 py-1.5 text-sm bg-indigo-600 text-white rounded-md hover:bg-indigo-700">
                    Save
                </button>
            </div>
        </form>
    </td>
</tr>
