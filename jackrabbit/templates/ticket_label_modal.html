{# Add Label modal #}
<div class="fixed inset-0 z-50 overflow-y-auto" id="label-modal" role="dialog" aria-modal="true" aria-labelledby="label-modal-title">
    <div class="flex min-h-full items-center justify-center p-4">
        {# Backdrop #}
        <div class="fixed inset-0 bg-black/50 transition-opacity"
             hx-get="/tickets/{{ ticket.id }}/labels"
             hx-target="#labels-section"
             hx-swap="outerHTML"
             hx-trigger="click"></div>

        {# Modal content #}
        <div class="relative w-full max-w-md bg-white rounded-lg shadow-xl">
            <div class="flex items-center justify-between p-4 border-b border-gray-200">
                <h3 id="label-modal-title" class="text-lg font-semibold text-gray-900">Add Label to {{ ticket.full_id }}</h3>
                <button type="button"
                        class="text-gray-400 hover:text-gray-600"
                        hx-get="/tickets/{{ ticket.id }}/labels"
                        hx-target="#labels-section"
                        hx-swap="outerHTML">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <form hx-post="/api/v1/tickets/{{ ticket.id }}/labels"
                  hx-target="#labels-section"
                  hx-swap="outerHTML"
                  hx-ext="json-enc"
                  hx-headers='{"Content-Type": "application/json"}'
                  hx-on::after-request="if(event.detail.successful) { const m = document.getElementById('label-modal'); if (m) m.remove(); }"
                  class="p-4 space-y-4">

                <div>
                    <label for="label_name" class="block text-sm font-medium text-gray-700 mb-1">Label</label>
                    <input type="text"
                           name="name"
                           id="label_name"
                           list="label-suggestions"
                           maxlength="50"
                           required
                           autocomplete="off"
                           placeholder="Type a label and press Enter..."
                           class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                    <datalist id="label-suggestions">
                        {% for suggestion in suggestions %}
                        <option value="{{ suggestion.name }}"></option>
                        {% endfor %}
                    </datalist>
                    <p class="mt-1 text-xs text-gray-500">A label that does not exist yet is created. Names may contain letters, digits, spaces, hyphens, underscores and colons.</p>
                </div>

                {# Error display #}
                <div id="modal-error" class="hidden p-3 bg-red-50 border border-red-200 rounded-md text-sm text-red-700"></div>

                <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">
                    <button type="button"
                            class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50"
                            hx-get="/tickets/{{ ticket.id }}/labels"
                            hx-target="#labels-section"
                            hx-swap="outerHTML">
                        Cancel
                    </button>
                    <button type="submit"
                            class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 border border-transparent rounded-md hover:bg-indigo-700">
                        Add Label
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
